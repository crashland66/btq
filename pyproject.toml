[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bt-pipeline"
version = "0.1.0"
description = "Local-first deterministic field-operations pipeline"
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4",
  "Markdown",
  "openai-whisper",
  "PyYAML",
  "torch",
]

[project.optional-dependencies]
vision-mlx = ["mlx-vlm", "Pillow"]
dev = [
  "pymarkdownlnt",
  "pytest",
  "ruff==0.11.13",
  "tomli; python_version < '3.11'",
]

[tool.setuptools]
package-dir = {"" = "project"}
py-modules = ["config", "queue_spec"]

[tool.setuptools.packages.find]
where = ["project"]

[tool.pytest.ini_options]
pythonpath = ["project"]
# Two test trees: tests/ (ops-dashboard suite) and project/tests/ (embedded
# unit tests). Both are pinned here so bare `pytest` always collects the full
# suite — `pytest tests/` is an undercount. See ai-methodology WORKFLOW.md.
testpaths = ["tests", "project/tests"]

[tool.ruff]
target-version = "py39"
src = ["project"]
exclude = [
  ".pytest_cache",
  ".venv",
  "**/site-packages",
  "__pycache__",
  "project/.venv",
  "uv.lock",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
  # Baseline ratchet (btq 50a188e, prompt 276): the existing violations below are
  # grandfathered so ruff is GREEN now and enforces these rules only on NEW code.
  # Cleanup is a dedicated follow-up arc — flip these off one rule at a time.
  # Counts are at the baseline commit.
  "E501", # line-too-long (9246) — needs a ruff format pass
  "E402", # module-import-not-at-top-of-file (14)
  "E701", # multiple-statements-on-one-line-colon (10)
  "E702", # multiple-statements-on-one-line-semicolon (12)
  "E731", # lambda-assignment (2)
  "I001", # unsorted-imports (245) — import-sort churn deferred
  "F401", # unused-import (138) — re-verify each per the M2 lesson before removing
  "F811", # redefined-while-unused (4)
  "F841", # unused-variable (7)
  "F821", # undefined-name (11) — all function-local/conditional-import false positives
  "F402", # import-shadowed-by-loop-var (1)
  "F541", # f-string-missing-placeholders (1)
]
