name: Sanitization

on:
  pull_request:
  push:

jobs:
  sanitization:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run public-repo sanitization scan
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: ./scripts/sanitization-scan --ci
